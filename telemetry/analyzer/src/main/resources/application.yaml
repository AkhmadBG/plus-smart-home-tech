server:
  port: 8082

grpc:
  client:
    hub-router:
      address: 'static://localhost:59090'
      enableKeepAlive: true
      keepAliveWithoutCalls: true
      negotiationType: plaintext

spring:
  application:
    name: analyzer
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:6541/psht_db
    username: psht_db
    password: psht_db
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    show-sql: true

analyzer:
  kafka:
    common-properties:
      "bootstrap.servers": localhost:9092
      "key.deserializer": "org.apache.kafka.common.serialization.VoidDeserializer"
    consumers:

      - type: SnapshotProcessor
        properties:
          "value.deserializer": "ru.yandex.practicum.telemetry.analyzer.config.SensorSnapshotDeserializer"
          "group.id": "telemetry.analyzer.snapshot.group"
          "client.id": "telemetry-analyzer-snapshot"
        topics:
          - "telemetry.snapshots.v1"
        poll-timeout: 500ms

      - type: HubEventProcessor
        properties:
          "value.deserializer": "ru.yandex.practicum.telemetry.analyzer.config.HubEventDeserializer"
          "group.id": "telemetry.analyzer.hub.group"
          "client.id": "telemetry-analyzer-hub"
        topics:
          - "telemetry.hubs.v1"
        poll-timeout: 2000ms