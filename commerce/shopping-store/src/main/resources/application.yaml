spring:
  application:
    name: shopping-store
  sql:
    init:
      mode: always
  datasource:
    url: jdbc:postgresql://localhost:6541/psht_db
    username: psht_db
    password: psht_db
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  config:
    import: "configserver:"
  cloud:
    config:
      fail-fast: true
      retry:
        useRandomPolicy: true
        max-interval: 6000
      discovery:
        enabled: true
        serviceId: config-server

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/